            <div class="mountp" id="mountp">
                <h1 class="page-title">登山記録</h1>
                <div class="subject">
                    <h2 class="mtname">釈迦ヶ岳</h2>
                    <div class="items">
                        <p>旭ダム<br>
                            <img src="contentsImg/sha_dam.jpeg" class="item" data-title="旭ダム"
                                data-src="contentsImg/sha_dam.jpeg" data-text="登っていく道中にあったダム。迫力満点">
                        </p>
                        <!-- <p>切り株<br>
                            <img src="contentsImg/sha_stump.jpeg" class="item" data-title="切り株"
                                data-src="contentsImg/sha_stump.jpeg" data-text="">
                        </p> -->
                        <p>樹洞<br>
                            <img src="contentsImg/sha_treecave.jpeg" class="item" data-title="樹洞"
                                data-src="contentsImg/sha_treecave.jpeg" data-text="何があったらこんな形になるのだろうか">
                        </p>
                        <p>岩<br>
                            <img src="contentsImg/sha_unnatural.jpg" class="item" data-title="岩"
                                data-src="contentsImg/sha_unnatural.jpg" data-text="まるで人工物のような平たい岩">
                        </p>
                        <p>日の出<br>
                            <img src="contentsImg/sha_sunset.jpeg" class="item" data-title="日の出"
                                data-src="contentsImg/sha_sunset.jpeg"
                                data-text="朝早くの登山だったので山の景色は青みを帯びていたが、陽が差したことで温かみを帯びた風景になった">
                        </p>
                        <p>雲海<br>
                            <img src="contentsImg/sha_sea_of_clouds.jpeg" class="item" data-title="雲海"
                                data-src="contentsImg/sha_sea_of_clouds.jpeg"
                                data-text="登り始めは周りが見えずただの森や山とそう変わらなかったが、周りが開け雲海が見えてきてやっと自分が標高1800m近くにいるのだと実感できた。">
                        </p>
                        <p>根の壁<br>
                            <img src="contentsImg/sha_roots.jpeg" class="item" data-title="根の壁"
                                data-src="contentsImg/sha_roots.jpeg" data-text="ぱっと見地面に張っている木の根のように見えるが、じつはこれは倒木の根が土をつかんだまま壁のようになっていたものである。
                                ところどころ穴が開いていて向こう側の景色が見えるのが面白かった">
                        </p>
                        <p>なだらかな丘<br>
                            <img src="contentsImg/sha_hill.jpeg" class="item" data-title="なだらかな丘"
                                data-src="contentsImg/sha_hill.jpeg" data-text="朝日に照らされるなだらかな山肌。
                                低木ばかりが生えていて遠くまで続く山の連なりが巨大な龍の背のように見えた">
                        </p>
                        <p>釈迦ヶ岳頂上<br>
                            <img src="contentsImg/shaka.jpg" class="item" data-title="釈迦ヶ岳頂上"
                                data-src="contentsImg/shaka.jpg" data-text="距離4㎞と登り600mを2時間かけてやっと頂上にたどり着いた。
                                そこには大きな釈迦如来像が立っていて朝日を背に受け、まるで後光がさしているかのような光景があった。">
                        </p>
                    </div>
                    <h2>大台ケ原</h2>
                    <div class="items">
                        <p>夕日と雲海<br>
                            <img src="contentsImg/odai_sun.JPG" class="item" data-title="夕日と雲海"
                                data-src="contentsImg/odai_sun.JPG" data-text="ふもとから登山道まで登っていく道中の写真。雲と雲の間から陽が差し込む瞬間
                                ">
                        </p>
                        <p>階段<br>
                            <img src="contentsImg/odai_upstair.JPG" class="item" data-title="階段"
                                data-src="contentsImg/odai_upstair.JPG" data-text="未舗装の道もところどころある中、このような階段はあまり疲れずに登れた">
                        </p>
                        <p>大蛇嵓<br>
                            <img src="contentsImg/odai_daija.jpg" class="item" data-title="大蛇嵓"
                                data-src="contentsImg/odai_daija.jpg" data-text="左端の方にあるのが大蛇嵓で遠めに見ると大蛇の頭のように見えるということからそう呼ばれるようになった。
                                嵓に乗って写真を撮ったり景色を見ることもできるが柵と鎖しかないので落ちないように注意">
                        </p>
                        <p>頂上の雲海<br>
                            <img src="contentsImg/odai_sea_of_clouds.JPG" class="item" data-title="頂上の雲海"
                                data-src="contentsImg/odai_sea_of_clouds.JPG" data-text="隙間なく雲に埋め尽くされる様は正しく海のようだった">
                        </p>

                    </div>
